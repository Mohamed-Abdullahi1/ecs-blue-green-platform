name: OIDC Security Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect OIDC token claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.parse

          base_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in base_url else "?"
          url = base_url + separator + urllib.parse.urlencode(
              {"audience": "sts.amazonaws.com"}
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              }
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("=== GitHub OIDC Claims ===")

          for key in (
              "iss",
              "aud",
              "sub",
              "repository",
              "ref",
              "event_name",
              "job_workflow_ref"
          ):
              print(f"{key}: {claims.get(key)}")

          print("==========================")
          PY

      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::454374565233:role/github-oidc-security-test
          aws-region: eu-west-2
          retry-max-attempts: 1

      - name: Verify identity
        run: aws sts get-caller-identity
